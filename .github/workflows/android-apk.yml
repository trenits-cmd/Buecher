name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Gradlew Ausführungsrechte vergeben
        run: chmod +x gradlew

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: APK als Actions-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: buecherregal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: APK-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: buecherregal-apk
          path: release

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          name: Bücher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/app-debug.apk
